<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
<title>TGDG Overwatch</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="chrome">
    <div id="tabbar">
      <div id="tabs" role="tablist" aria-label="Tools"></div>
      <button id="menu-btn" type="button" title="All tools" aria-haspopup="true" aria-expanded="false" hidden>&#9776;</button>
    </div>

    <div id="topbar">
      <span id="active-tool-name"></span>
      <button id="reload-btn" type="button" title="Reload this tool">&#8635;</button>
      <button id="toggle-settings" type="button" title="Panel settings" aria-expanded="false" hidden>&#9881;</button>
    </div>

    <div id="settings" hidden>
      <label for="server-input">Server address (used by every tab)</label>
      <div class="row">
        <input id="server-input" type="text" spellcheck="false" placeholder="http://localhost:3000" />
        <button id="save-server" type="button">Save</button>
      </div>
      <p id="settings-error" class="error" role="alert" hidden></p>

      <span class="label">Panel width</span>
      <div class="row" id="width-row"></div>
      <button id="next-screen" type="button" class="secondary" hidden>Move to next screen</button>

      <span class="label" id="tabs-label">Tabs</span>
      <div id="tab-toggles"></div>
    </div>
  </div>

  <div id="menu-panel" role="menu" aria-label="All tools" hidden></div>

  <script src="shell-logic.js"></script>
  <script src="tools.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
