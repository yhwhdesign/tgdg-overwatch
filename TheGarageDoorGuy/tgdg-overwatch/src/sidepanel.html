<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TGDG Overwatch</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="rail" role="tablist" aria-label="Docked tools"></div>

  <div id="topbar">
    <span id="active-tool-name"></span>
    <button id="toggle-settings" title="Change this tool's URL">&#9881;</button>
  </div>

  <div id="settings">
    <input id="url-input" type="text" placeholder="http://localhost:3000" />
    <button id="save-url">Save</button>
  </div>

  <div id="frame-wrap">
    <iframe id="app" src=""></iframe>
  </div>

  <script src="tools.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
